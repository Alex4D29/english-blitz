<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<title>English Blitz!</title>
<link rel="stylesheet" href="css/frame.css">
</head>
<body>
<div id="burst"></div>

<!-- Title -->
<section id="title" class="screen scroll">
  <h1 class="shout logo" data-text="title"></h1>
  <div class="menu">
    <button class="mode-btn fun" id="funBtn" disabled><span class="ico" aria-hidden="true">🎈</span><span data-text="fun"></span></button>
    <button class="mode-btn challenge" id="challengeBtn" disabled><span class="ico" aria-hidden="true">🔥</span><span data-text="challenge"></span></button>
    <button class="mode-btn practice" id="practiceBtn" disabled><span class="ico" aria-hidden="true">🎯</span><span data-text="practice"></span></button>
    <button class="chunky" id="settingsBtn">⚙️ <span data-text="settings"></span></button>
  </div>
  <p id="loading" data-text="loading"></p>
</section>

<!-- What to play: letters, phonics, CVC words and/or sight words (shown after a mode button) -->
<section id="content" class="screen scroll" hidden>
  <h1 class="shout" data-text="whatToPlay"></h1>
  <p class="card" data-text="pickContent"></p>
  <div id="contentGrid" role="group"></div>
  <div class="buttons">
    <button class="chunky hot" id="contentGoBtn">▶️ <span data-text="play"></span></button>
    <button class="chunky" id="contentBackBtn">⬅️ <span data-text="back"></span></button>
  </div>
</section>

<!-- Practice: pick one game -->
<section id="practice" class="screen scroll" hidden>
  <h1 class="shout" data-text="practice"></h1>
  <p class="card" data-text="pickGame"></p>
  <div id="practiceGrid"></div>
  <button class="chunky" id="practiceBackBtn">⬅️ <span data-text="back"></span></button>
</section>

<!-- Practice: how to play the chosen game -->
<section id="howto" class="screen scroll" hidden>
  <div id="howtoIcon" aria-hidden="true"></div>
  <h1 class="shout" id="howtoName"></h1>
  <div class="card" id="howtoCard">
    <h2 data-text="howToPlay"></h2>
    <ol id="howtoSteps"></ol>
    <div id="howtoTipsBox">
      <h3>💡 <span data-text="tips"></span></h3>
      <ul id="howtoTips"></ul>
    </div>
  </div>
  <div class="buttons">
    <button class="chunky hot" id="howtoPlayBtn">▶️ <span data-text="play"></span></button>
    <button class="chunky" id="howtoBackBtn">⬅️ <span data-text="back"></span></button>
  </div>
</section>

<!-- Settings (placeholder) -->
<section id="settings" class="screen" hidden>
  <h1 class="shout" data-text="settings"></h1>
  <p class="card" data-text="settingsSoon"></p>
  <button class="chunky" id="backBtn">⬅️ <span data-text="back"></span></button>
</section>

<!-- Play -->
<div id="play" hidden>
  <header>
    <button class="pill" id="quitBtn" data-label="quit">✕</button>
    <div class="pill" id="status" role="status"></div>
    <div class="pill" id="roundPill"></div>
    <button class="pill" id="helpBtn" data-label="helpLabel" hidden>❓</button>
  </header>
  <div id="timer" role="progressbar" aria-hidden="true"><div id="bar"></div></div>
  <main id="stage">
    <div id="game"></div>
    <div id="banner" hidden><div class="banner-icon" aria-hidden="true"></div><div class="shout"></div><div class="hint" hidden><span class="hint-icon" aria-hidden="true"></span><span class="hint-word"></span></div></div>
    <div id="stamp" hidden><div class="shout"></div></div>
  </main>
</div>

<!-- Results -->
<section id="results" class="screen" hidden>
  <h1 class="shout" id="resTitle"></h1>
  <div id="stars" role="img" hidden></div>
  <div class="card" id="resStats"></div>
  <p class="shout" id="record" hidden></p>
  <div class="buttons">
    <button class="chunky hot" id="againBtn">🔁 <span data-text="again"></span></button>
    <button class="chunky" id="menuBtn">🏠 <span data-text="menu"></span></button>
  </div>
</section>

<!-- Order matters: text and core (which defines registerMicrogame) come first.
     The frame then loads every game listed in games/manifest.js. -->
<script src="js/text.js"></script>
<script src="js/core.js"></script>
<script src="data/lists.js"></script>
<script src="js/modes.js"></script>
<script src="games/manifest.js"></script>
<script src="js/frame.js"></script>
</body>
</html>
