<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<title>English Blitz!</title>
<link rel="stylesheet" href="css/frame.css">
</head>
<body>
<div id="burst"></div>

<!-- Title -->
<section id="title" class="screen scroll">
  <h1 class="shout logo" data-text="title"></h1>
  <div class="menu">
    <button class="mode-btn fun" id="funBtn" disabled><span class="ico" aria-hidden="true">🎈</span><span class="mode-txt"><span data-text="fun"></span><span class="mode-desc" data-text="funDesc"></span></span></button>
    <button class="mode-btn challenge" id="challengeBtn" disabled><span class="ico" aria-hidden="true">🔥</span><span class="mode-txt"><span data-text="challenge"></span><span class="mode-desc" data-text="challengeDesc"></span></span></button>
    <button class="mode-btn boss" id="bossBtn" disabled><span class="ico" aria-hidden="true">👑</span><span class="mode-txt"><span data-text="boss"></span><span class="mode-desc" data-text="bossDesc"></span></span></button>
    <button class="mode-btn versus" id="versusBtn" disabled><span class="ico" aria-hidden="true">⚔️</span><span class="mode-txt"><span data-text="versus"></span><span class="mode-desc" data-text="versusDesc"></span></span></button>
    <button class="mode-btn practice" id="practiceBtn" disabled><span class="ico" aria-hidden="true">🎯</span><span class="mode-txt"><span data-text="practice"></span><span class="mode-desc" data-text="practiceDesc"></span></span></button>
    <button class="mode-btn tutorials" id="tutorialsBtn" disabled><span class="ico" aria-hidden="true">👀</span><span class="mode-txt"><span data-text="tutorials"></span><span class="mode-desc" data-text="tutorialsDesc"></span></span></button>
    <button class="chunky char-btn" id="charBtn"><span class="char-mini" aria-hidden="true"></span><span data-text="character"></span></button>
    <button class="chunky" id="settingsBtn">⚙️ <span data-text="settings"></span></button>
  </div>
  <p id="loading" data-text="loading"></p>
</section>

<!-- What to play: letters, phonics, CVC words and/or sight words (shown after a mode button) -->
<section id="content" class="screen scroll" hidden>
  <h1 class="shout" data-text="whatToPlay"></h1>
  <p class="card" data-text="pickContent"></p>
  <div id="contentGrid" role="group"></div>
  <div id="myWordsBox"></div>
  <div class="buttons">
    <button class="chunky hot" id="contentGoBtn">▶️ <span data-text="play"></span></button>
    <button class="chunky" id="contentBackBtn">⬅️ <span data-text="back"></span></button>
  </div>
</section>

<!-- Practice: pick one game -->
<section id="practice" class="screen scroll" hidden>
  <h1 class="shout" id="pickerTitle" data-text="practice"></h1>
  <p class="card" id="pickerNote" data-text="pickGame"></p>
  <div id="practiceGrid"></div>
  <button class="chunky" id="practiceBackBtn">⬅️ <span data-text="back"></span></button>
</section>

<!-- Practice: how to play the chosen game -->
<section id="howto" class="screen scroll" hidden>
  <div id="howtoIcon" aria-hidden="true"></div>
  <h1 class="shout" id="howtoName"></h1>
  <div class="card" id="howtoCard">
    <h2 data-text="howToPlay"></h2>
    <ol id="howtoSteps"></ol>
    <div id="howtoTipsBox">
      <h3>💡 <span data-text="tips"></span></h3>
      <ul id="howtoTips"></ul>
    </div>
  </div>
  <!-- Practice difficulty: three speeds from Challenge mode (built by frame.js) -->
  <div class="diff" id="diffRow" role="group"></div>
  <div class="buttons">
    <button class="chunky hot" id="howtoPlayBtn">▶️ <span data-text="play"></span></button>
    <button class="chunky" id="howtoWatchBtn" hidden>👀 <span data-text="watch"></span></button>
    <button class="chunky" id="howtoBackBtn">⬅️ <span data-text="back"></span></button>
  </div>
</section>

<!-- Settings: music (on/off and volume) and listening games (on/off) -->
<section id="settings" class="screen scroll" hidden>
  <h1 class="shout" data-text="settings"></h1>
  <div class="card set-card">
    <div class="set-row">
      <span class="set-ico" aria-hidden="true">🎵</span>
      <span class="set-name" data-text="musicLabel"></span>
      <button class="set-toggle" id="musicBtn" aria-pressed="true"></button>
    </div>
    <label class="set-vol"><span class="set-ico small" aria-hidden="true">🔈</span>
      <input type="range" id="musicVol" min="0" max="100" step="5" data-label="musicVolLabel">
      <span class="set-ico small" aria-hidden="true">🔊</span></label>
    <div class="set-row">
      <span class="set-ico" aria-hidden="true">🎧</span>
      <span class="set-name" data-text="listeningLabel"></span>
      <button class="set-toggle" id="listeningBtn" aria-pressed="true"></button>
    </div>
    <p class="set-note" data-text="listeningNote"></p>
    <div class="set-row">
      <span class="set-ico" aria-hidden="true">👤</span>
      <span class="set-name" data-text="resetCharsLabel"></span>
      <button class="set-toggle" id="resetCharsBtn" data-text="resetChars"></button>
    </div>
  </div>
  <button class="chunky" id="backBtn">⬅️ <span data-text="back"></span></button>
</section>

<!-- ⭐ MY WORDS: choose the words every game's targets come from (Word of the Week) -->
<section id="words" class="screen scroll" hidden>
  <h1 class="shout" data-text="wordsTitle"></h1>
  <p class="card" data-text="wordsNote"></p>
  <p class="shout" id="wordsCount"></p>
  <div id="wordsGrid"></div>
  <div class="buttons">
    <button class="chunky hot" id="wordsDoneBtn">✔️ <span data-text="wordsDone"></span></button>
    <button class="chunky" id="wordsClearBtn">🧹 <span data-text="wordsClear"></span></button>
  </div>
</section>

<!-- Play -->
<div id="play" hidden>
  <header>
    <button class="pill" id="quitBtn" data-label="quit">✕</button>
    <div class="pill" id="status" role="status"></div>
    <div class="pill" id="roundPill"></div>
    <button class="pill" id="helpBtn" data-label="helpLabel" hidden>❓</button>
  </header>
  <div id="timer" role="progressbar" aria-hidden="true"><div id="bar"></div></div>
  <main id="stage">
    <div id="game"></div>
    <div id="banner" hidden><div class="banner-icon" aria-hidden="true"></div><div class="shout"></div><div class="banner-char" aria-hidden="true"></div></div>
    <div id="stamp" hidden><div class="shout"></div></div>
  </main>
</div>

<!-- 👀 Watch first? Pops up after PLAY / PLAY AGAIN in Fun and Challenge (new games show a tutorial first) -->
<div id="askWatch" class="ask" hidden role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <div class="ask-card card">
    <div class="ask-icon" aria-hidden="true">👀</div>
    <h2 class="shout" id="askTitle" data-text="askWatch"></h2>
    <div class="ask-buttons">
      <button class="chunky ask-yes" id="watchYes">👀 <span data-text="watchYes"></span></button>
      <button class="chunky ask-no" id="watchNo">🙈 <span data-text="watchNo"></span></button>
    </div>
  </div>
</div>

<!-- Results -->
<section id="results" class="screen" hidden>
  <div id="resChar" aria-hidden="true"></div>
  <h1 class="shout" id="resTitle"></h1>
  <div id="stars" role="img" hidden></div>
  <div class="card" id="resStats"></div>
  <p class="shout" id="record" hidden></p>
  <div class="buttons">
    <button class="chunky hot" id="againBtn">🔁 <span data-text="again"></span></button>
    <button class="chunky" id="menuBtn">🏠 <span data-text="menu"></span></button>
  </div>
</section>

<!-- Order matters: text and core (which defines registerMicrogame) come first.
     The frame then loads every game listed in games/manifest.js. -->
<script src="js/text.js"></script>
<script src="js/core.js"></script>
<script src="js/music.js"></script>
<script src="js/power.js"></script>
<script src="data/lists.js"></script>
<script src="js/modes.js"></script>
<script src="js/mascot.js"></script>
<script src="js/boss.js"></script>
<script src="js/versus.js"></script>
<script src="games/manifest.js"></script>
<script src="js/frame.js"></script>
</body>
</html>
